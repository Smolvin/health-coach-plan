# Прод-деплой — см. docs/vps-deploy.md (публичная версия) и
# docs/vps-deploy.notes.md (gitignored, реальные домен/хост/пути).
#
# Общий образ рантайма (node:20-alpine) + код монтируется с хоста, а не
# копируется в образ на этапе сборки — тот же паттерн, что уже используют
# node-app/php-fpm/python-worker в docker/prod инфраструктурного
# репозитория и pet-проекты в его docker/local. Плюсы именно для этого
# проекта: `git pull` + `docker compose restart` применяет новый код без
# `docker build` (быстрее, не нужен образ/registry на проект); заодно
# полностью снимает проблему "забыли скопировать в образ ещё один каталог"
# (см. ROADMAP.md/CHANGELOG.md — так уже случилось с migrations/).
# `node_modules` — тоже на хосте, не в образе: см. docs/vps-deploy.md,
# шаг «первый раз/при обновлении package.json».
#
# bot — Telegram long polling (см. src/bot.js), исходящие соединения only,
# наружу НЕ смотрит (входящих нет) — не подключён к apps_edge_internal. Но
# "исходящие соединения" здесь в буквальном смысле — реальный интернет
# (api.telegram.org), а prod_data_edge (см. ниже) internal:true, без
# шлюза наружу вообще. Подключение только к ней ломает бота на
# EAI_AGAIN api.telegram.org — подтверждено реальным деплоем. Сеть
# `egress` ниже — обычный (не internal) bridge, только для этого
# compose-проекта, даёт исходящий интернет, не более того.
# admin — единственный публичный компонент, уже закрыт HTTP Basic Auth на
# уровне самого приложения (ADMIN_WEB_USER/ADMIN_WEB_PASSWORD, см.
# src/admin/server.js) — внешний реверс-прокси поверх ничего не добавляет,
# кроме TLS/rate-limit.
#
# name: обязателен — без него Compose берёт имя проекта из имени папки
# (здесь "prod", как у любого другого внешнего проекта на этом VPS) —
# подтверждено реальным инцидентом (2026-09-05, см. CHANGELOG.md).
name: health-coach-plan

networks:
  apps_edge_internal:
    name: apps_edge_internal
    external: true
  # Доступ к shared MySQL/MinIO этого VPS (НЕ то же самое, что
  # apps_edge_internal — та только пробрасывает HTTP снаружи).
  prod_data_edge:
    name: prod_data_edge
    external: true
  # Обычный bridge (НЕ internal) — только для исходящего интернета боту
  # (Telegram API). Локальная для этого compose-проекта, не shared/external
  # — ни с чем другим её не нужно объединять.
  egress:
    driver: bridge

services:
  bot:
    image: node:20-alpine
    container_name: health-coach-bot
    working_dir: /app
    volumes:
      - ../..:/app
    env_file: ../../.env
    command: ["node", "src/bot.js"]
    restart: unless-stopped
    networks: [prod_data_edge, egress]
    mem_limit: 256m

  admin:
    image: node:20-alpine
    container_name: health-coach-admin
    working_dir: /app
    volumes:
      - ../..:/app
    env_file: ../../.env
    command: ["node", "src/admin/server.js"]
    restart: unless-stopped
    networks: [prod_data_edge, apps_edge_internal]
    healthcheck:
      # nc, не wget/curl — админка целиком за Basic Auth, простая проверка
      # "порт открыт" не требует разбираться с кредами внутри healthcheck.
      # 4000 — дефолт ADMIN_PORT из .env.example; если в реальном .env
      # ADMIN_PORT переопределён, поправить и здесь.
      test: ["CMD", "nc", "-z", "127.0.0.1", "4000"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 256m
